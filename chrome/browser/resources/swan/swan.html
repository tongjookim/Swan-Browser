<!doctype html>
<html dir="ltr" lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SWAN · CODA</title>
    <link rel="stylesheet" href="chrome://resources/css/text_defaults.css">
    <link rel="stylesheet" href="swan.css">
  </head>
  <body>
    <header>
      <h1>SWAN <span class="brand-sub">CODA</span></h1>
      <div id="account"></div>
    </header>

    <div id="notice" role="alert" hidden></div>

    <main id="signedOut" hidden>
      <h2>수완뉴스 계정으로 시작하세요</h2>
      <p>SWAN은 수완뉴스 계정으로 로그인하면 CODA AI 챗봇을 사용할 수 있습니다.
         로그인은 수완뉴스(swn.kr) 화면에서 이루어지며, 이 브라우저는 비밀번호를
         저장하거나 보지 않습니다.</p>
      <button id="loginBtn" class="primary">수완뉴스 계정으로 로그인</button>
    </main>

    <main id="chat" hidden>
      <section id="messages" aria-live="polite"></section>

      <form id="form" autocomplete="off">
        <input id="input" type="text" maxlength="1000"
               placeholder="CODA에게 물어보세요" aria-label="질문">
        <button type="submit" class="primary">보내기</button>
      </form>
      <button id="summarizePage" class="link" hidden>현재 페이지 요약</button>

      <details id="settings">
        <summary>설정</summary>
        <label class="opt">
          <input type="checkbox" id="optAutoSearch">
          <span>근거가 부족하면 학습 자료에서 자동으로 더 검색<br>
            <small>질문이 수완뉴스 서버(CODA)로 전송됩니다.</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="optWebSearch">
          <span>웹 검색 허용 (DuckDuckGo)<br>
            <small>검색어가 DuckDuckGo로 전송되고, 검색된 페이지 본문(최대 4,000자)이
              요약을 위해 수완뉴스 서버로 전송됩니다. 로그인 정보나 쿠키는
              보내지 않습니다. 기본은 꺼짐입니다.</small></span>
        </label>
        <label class="opt">
          <input type="checkbox" id="optPageContext">
          <span>현재 페이지 요약 허용<br>
            <small>버튼을 누를 때에만 현재 탭의 본문(최대 4,000자)이 수완뉴스
              서버로 전송됩니다. 시크릿 창, 로그인·결제 화면, chrome:// 페이지는
              제외됩니다.</small></span>
        </label>
      </details>
    </main>

    <script type="module" src="main.js"></script>
  </body>
</html>
