name: swan-windows-build

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'runs-on 라벨 (JSON 배열). 예: ["self-hosted","windows","x64"] 또는 ["windows-2022"]'
        default: '["self-hosted","windows","x64"]'
        required: true
      jobs:
        description: 'autoninja 병렬도(-j). 비우면 자동'
        default: ''
        required: false
      target:
        description: 'ninja 타깃'
        default: 'chrome'
        required: true

  repository_dispatch:
    types: [swan-windows-build-trigger]

jobs:
  build:
    runs-on: ${{ fromJSON(github.event.client_payload.runner || inputs.runner || '["self-hosted","windows","x64"]') }}
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1
          clean: false

      - name: 빌드 (autoninja)
        working-directory: src
        run: |
          $j = '${{ github.event.client_payload.jobs || inputs.jobs }}'
          $target = '${{ github.event.client_payload.target || inputs.target || 'chrome' }}'
          if ($j) { autoninja -C out/swan -j $j $target } else { autoninja -C out/swan $target }
